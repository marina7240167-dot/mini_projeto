<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VesteBem{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}">VesteBem</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Abrir menu"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="menu"><ul class="navbar-nav ms-auto">
        {% for endpoint, nome in [('inicio', 'Início'), ('catalogo', 'Catálogo'), ('ofertas', 'Ofertas'), ('sobre', 'Sobre')] %}
        <li class="nav-item"><a class="nav-link {% if request.endpoint == endpoint %}active{% endif %}" href="{{ url_for(endpoint) }}">{{ nome }}</a></li>
        {% endfor %}
      </ul></div>
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer class="py-4 text-center">VesteBem · Loja de roupas fictícia para fins educacionais.</footer>
  <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
